<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Reserva - Universidad</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --secondary-hover: #475569;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --focus-ring: rgba(37, 99, 235, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 2.5rem 1rem; }
        .container { max-width: 650px; margin: 0 auto; }
        .header { margin-bottom: 1.75rem; }
        h1 { font-size: 1.75rem; font-weight: 700; color: #0f172a; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; }
        .alert { padding: 1rem 1.25rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .card { background-color: var(--card-bg); border-radius: 0.75rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; color: #334155; }
        input, select { width: 100%; padding: 0.65rem 0.85rem; border-radius: 0.4rem; border: 1px solid var(--border); font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
        .row { display: flex; gap: 1rem; }
        .row .form-group { flex: 1; }
        .actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.75rem; }
        .btn { display: inline-flex; align-items: center; padding: 0.65rem 1.25rem; border-radius: 0.5rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #f1f5f9; color: #475569; }
        .btn-secondary:hover { background-color: #e2e8f0; }
        .help-text { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nueva Reserva de Laboratorio</h1>
            <p class="subtitle">Complete los datos de la reserva cumpliendo las políticas de horario</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card">
            <form th:action="@{/reservas}" th:object="${reserva}" method="post">
                <div class="form-group">
                    <label for="laboratorioSelect">Laboratorio</label>
                    <select id="laboratorioSelect" name="laboratorio.id" required>
                        <option value="" disabled selected>-- Seleccione un laboratorio --</option>
                        <option th:each="lab : ${laboratorios}" th:value="${lab.id}" th:text="${lab.nombre} + ' (' + ${lab.ubicacion} + ' - Cap: ' + ${lab.capacidad} + ')'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nombreSolicitante">Nombre del Solicitante</label>
                    <input id="nombreSolicitante" type="text" th:field="*{nombreSolicitante}" placeholder="Ej. Ana Torres" required />
                </div>

                <div class="form-group">
                    <label for="correoSolicitante">Correo Electrónico</label>
                    <input id="correoSolicitante" type="email" th:field="*{correoSolicitante}" placeholder="solicitante@universidad.edu.co" required />
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="inicio">Fecha y Hora de Inicio</label>
                        <input id="inicio" type="datetime-local" th:field="*{inicio}" required />
                        <p class="help-text">Horario permitido: 07:00 a 21:00</p>
                    </div>
                    <div class="form-group">
                        <label for="fin">Fecha y Hora de Fin</label>
                        <input id="fin" type="datetime-local" th:field="*{fin}" required />
                        <p class="help-text">Duración entre 30 min y 3 horas</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="motivo">Motivo o Propósito de la Reserva</label>
                    <input id="motivo" type="text" th:field="*{motivo}" placeholder="Ej. Práctica de Sistemas Operativos" required />
                </div>

                <div class="actions">
                    <a href="/reservas" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Crear Reserva</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
